<div class="ad-card">

  <div class="ad-image" (click)="onView()">
<img [src]="ad.firstImage ? 'data:image/jpeg;base64,' + ad.firstImage : './ad-placeholder.jpg'" />    <span class="status-badge active">
      {{ ad.status }}
    </span>
  </div>

  <div class="ad-content">

    <div class="d-flex align-items-center justify-content-between">
      <h3 class="ad-title">
        {{ ad.title }}
      </h3>

      <div class="ad-price">
        PKR {{ ad.price | number }}
      </div>
    </div>
    <p class="">
      {{ ad.name }}
    </p>

    <div class="ad-meta">
      <span>
        <i class="fa-solid fa-map-location-dot sub-icons"></i> {{ ad.cityArea }}
      </span>

      <span>
        <i class="fa-solid fa-sitemap sub-icons"></i> {{ ad.subCategory }}
      </span>
    </div>

    <div class="ad-footer">

      <span class="ad-date">
        <i class="fa fa-calendar sub-icon"></i> Started: {{ ad.startsOn | date:'dd MMM yyyy' }}
        <br>
        <i class="fa fa-calendar sub-icon"></i> Ended: {{ ad.endsOn | date:'dd MMM yyyy' }}
      </span>

      <div class="actions">
        <button class="btn-view" (click)="onView()">View</button>
        <button class="btn-edit" (click)="onEdit()">Edit</button>
        <button class="btn-delete" (click)="onDelete()">Delete</button>
      </div>

    </div>

  </div>

</div>
