<div class="page-container">

  <!-- PAGE HEADER -->
  <div *ngIf="isAdmin()" class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h1>Advertisement Management</h1>
      <p>Manage all advertisements posted in Pak Classified.</p>
    </div>

    <button class="add-btn" (click)="addAdvertisement()"><i class="fas fa-bullhorn icon me-1"></i> Post New Ad</button>
  </div>



  <!-- TOOLBAR -->
  <div class="toolbar col-12">
    <input class="search-input col-10" type="text" placeholder="Search Advertisement...">

    <select class="filter-select col-2">
      <option>Apply Filters</option>
      <option>Active</option>
      <option>Inactive</option>
      <option>Pending</option>
    </select>
  </div>

  <!-- CATALOGUE SECTION -->
  <div class="catalogue">

    <app-ad-card *ngFor="let ad of advertisements()" [ad]="ad" (view)="viewAdvertisement($event)"
      (edit)="editAdvertisement($event)" (delete)="deleteAdvertisement($event)">
    </app-ad-card>

  </div>
</div>
