<div class="media-card-overlay">

  <img [src]="'data:image/jpeg;base64,' + image.content || './ad.jpg'" [alt]="image.name" />

  <div class="overlay-content">
    <div class="cursor-pointer" (click)="onView()">
      <h3> {{ image.name }} </h3>

      <p class="caption">{{ image.caption }}</p>

      <div class="meta">
        <span>{{ image.advertisement }}</span>
        <span>Uploaded by {{ image.createdBy }}</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-edit" (click)="onEdit()">Edit</button>
      <button class="btn btn-delete" (click)="onDelete()">Delete</button>
    </div>

  </div>

</div>
