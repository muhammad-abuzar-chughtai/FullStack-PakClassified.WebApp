<div class="table-wrapper">

  <div class="table-header">
    <div class="page-header">
      <h2>Country Management</h2>
      <p class="breadcrumb mt-2"><a class="breadcrumb-link" routerLink="/admin">Home</a> / Location / Country Management
      </p>
    </div>

    <button *ngIf="isAdmin()" class="primary-btn" (click)="addCountry()">
      <i class="fas fa-plus plus"></i> Add
    </button>
  </div>

    <input class="search-input col-12 mb-3" type="text" placeholder="Search Country..." [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)" (keydown.enter)="searchQuery.set(searchQuery())" />

  <div class="table-container">
    <table class="component-table">

      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Created By</th>
          <th *ngIf="isAdmin()">Actions</th>
        </tr>
      </thead>

      <tbody>
        <!-- <tr *ngIf="filteredCountries().length === 0"> -->
        <tr *ngFor="let country of filteredCountries(); let i = index">

          <td>{{ i + 1 }}</td>
          <td>{{ country.name }}</td>
          <td>{{ country.createdBy || '' }}</td>

          <td *ngIf="isAdmin()" class="actions">
            <button class="edit-btn" (click)="editCountry(country)"><i class="fas fa-edit icon"></i></button>
            <button class="delete-btn" (click)="deleteCountry(country.id)"><i class="fas fa-trash icon"></i></button>
          </td>

        </tr>

        <tr *ngIf="filteredCountries().length === 0">
          <td colspan="4" class="empty">
            No countries found.
          </td>
        </tr>

      </tbody>

    </table>
  </div>

</div>

<app-modal *ngIf="modalOpen()" [fields]="countryFields" [model]="selectedCountry() || {}" [mode]="modalMode()"
  entityName="Country" (save)="saveCountry($event)" (close)="modalOpen.set(false)">
</app-modal>
