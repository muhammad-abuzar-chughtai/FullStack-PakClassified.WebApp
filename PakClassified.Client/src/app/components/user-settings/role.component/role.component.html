<div class="table-wrapper">

  <div class="table-header">
    <h2>Role Management</h2>

    <button *ngIf="isAdmin()" class="primary-btn" (click)="addRole()">
      <i class="fas fa-plus plus"></i> Add
    </button>
  </div>

  <div class="table-container">
    <table class="component-table">

      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Created By</th>
          <th *ngIf="isAdmin()">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let role of roles(); let i = index">

          <td>{{ i + 1 }}</td>
          <td>{{ role.name }}</td>
          <td>{{ role.createdBy || '' }}</td>

          <td *ngIf="isAdmin()" class="actions">
            <button class="edit-btn" (click)="editRole(role)"><i class="fas fa-edit icon"></i></button>
            <button class="delete-btn" (click)="deleteRole(role.id)"><i class="fas fa-trash icon"></i></button>
          </td>

        </tr>

        <tr *ngIf="roles().length === 0">
          <td colspan="4" class="empty">
            No Roles found.
          </td>
        </tr>

      </tbody>

    </table>
  </div>

</div>

<app-modal *ngIf="modalOpen()" [fields]="roleFields" [model]="selectedRole() || {}" [mode]="modalMode()"
  entityName="Role" (save)="saveRole($event)" (close)="modalOpen.set(false)">
</app-modal>
